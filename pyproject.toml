[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalends"
version = "0.2.0"
description = "One calendar for every agent, job, and long-running task in a multi-agent fleet: a projection over existing schedulers, not a new scheduler."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "python-dateutil>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.1",
]
mcp = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.1",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
kalends = "kalends.cli:main"
kalends-mcp = "kalends.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
